version: 2

models:
  - name: alerta_preco_compras
    description: >
      ETL reverso. Materiais do último mês com preço do estoque acima da
      mediana pública (referência robusta, correspondência não marcada como
      palpite). Lida pelo setor de compras e pelas chefias de almoxarifado;
      a coluna justificativa_agente não é concedida a eles e as chefias só
      veem as linhas do seu almoxarifado (RLS).
    columns:
      - name: identificador_material
        data_tests: [not_null]
      - name: almoxarifado
        data_tests: [not_null]
      - name: diferenca_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('limiar_diferenca_pct', 30) }}"
      - name: compras_publicas
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('minimo_compras_referencia', 5) }}"
      - name: confianca_correspondencia
        data_tests:
          - accepted_values:
              arguments: {values: ['alta', 'media']}
              config:
                where: "tipo_revisor_correspondencia <> 'pessoa'"
