# SIGMA-UnB — plataforma de dados do almoxarifado da UnB
#
# Sobe tudo do zero com:
#     docker compose up --build
#
# Ordem de execução (garantida pelos depends_on):
#   1. db       — PostgreSQL, o sistema transacional (OLTP)
#   2. migrate  — Flyway aplica db/migrations/V*.sql em ordem, a partir do banco vazio
#   3. ingest   — baixa os dados abertos da UnB (dados/bruto) e carrega no banco
#   (em paralelo) minio — armazenamento de objetos compatível com S3: o data lake
#   4. extract  — E2: bruto do portal -> bronze, lote e CDC do Postgres -> Parquet,
#                 e verificação de que tudo chegou
#
# Todas as variáveis têm valor padrão, então nenhum .env é obrigatório.
# Para trocar senha ou porta, copie .env.example para .env e edite.

name: sigma-unb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigma}
      POSTGRES_USER: ${POSTGRES_USER:-sigma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigma}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # Porta do host configurável: útil se já houver um Postgres local na 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-sigma}
      - -user=${POSTGRES_USER:-sigma}
      - -password=${POSTGRES_PASSWORD:-sigma}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=10
      - migrate

  ingest:
    build:
      context: ./codigos
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-sigma}
      PGUSER: ${POSTGRES_USER:-sigma}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sigma}
    volumes:
      # Os arquivos baixados ficam em ./dados no host (ignorado pelo git).
      - ./dados:/app/dados

  extract:
    build:
      context: ./codigos
    depends_on:
      ingest:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-sigma}
      PGUSER: ${POSTGRES_USER:-sigma}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sigma}
      LAKE_ENDPOINT: minio:9000
      LAKE_USER: ${MINIO_USER:-sigma}
      LAKE_PASSWORD: ${MINIO_PASSWORD:-sigma12345}
    volumes:
      - ./dados:/app/dados
    # Os dois caminhos da E2, nesta ordem. Para rodar só um:
    #   docker compose run --rm --no-deps extract python capturar_mudancas.py
    command:
      - sh
      - -c
      - >-
        python enviar_bruto.py &&
        python extrair_lote.py &&
        python capturar_mudancas.py &&
        python verificar_e2.py

  minio:
    # Armazenamento analítico em formato aberto (Parquet), compatível com S3.
    # Tag fixa: a MinIO parou de publicar imagens novas da edição comunitária
    # em out/2025; esta continua disponível no Docker Hub.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sigma}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-sigma12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"          # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  minio-data:
