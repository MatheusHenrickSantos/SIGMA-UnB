# SIGMA-UnB — plataforma de dados do almoxarifado da UnB
#
# Sobe tudo do zero com:
#     docker compose up --build
#
# Ordem de execução (garantida pelos depends_on):
#   1. db          — PostgreSQL com pgvector (imagem construída em db/Dockerfile)
#   2. migrate     — Flyway aplica db/migrations/V*.sql em ordem, a partir do banco vazio
#   3. ingest      — baixa estoque e CATMAT e grava no schema raw
#   4. transformar — dbt: raw -> bronze -> prata, com os testes de dados (dbt build;
#                    snapshot e camada ouro ficam para o passo 7)
#   5. semantica   — embeddings e candidatos CATMAT para cada material (busca híbrida)
#                    e importação das decisões sugeridas por agentes de IA
#   6. compras     — compras públicas dos itens CATMAT aprovados -> raw.compras
#   7. transformar_ouro — dbt: compras (bronze, prata), snapshot SCD 2 e camada ouro
#
# Só o db fica rodando; os outros terminam (Exited 0) e o seguinte começa.
# O semantica baixa o modelo de linguagem (~0,5 GB) na primeira vez e guarda
# no volume `modelos`; ver docs/semantica.md.
#
# Todas as variáveis têm valor padrão, então nenhum .env é obrigatório.
# Para trocar senha, porta ou parâmetros da busca, copie .env.example para .env.

name: sigma-unb

x-conexao-banco: &conexao-banco
  HOST_DO_BANCO: db
  PORTA_DO_BANCO: 5432
  NOME_DO_BANCO: ${NOME_DO_BANCO:-sigma}
  USUARIO_DO_BANCO: ${USUARIO_DO_BANCO:-sigma}
  SENHA_DO_BANCO: ${SENHA_DO_BANCO:-sigma}

services:
  db:
    # postgres:16-alpine + pgvector. Mesma base de antes: o volume pgdata
    # existente continua válido (ver comentário em db/Dockerfile).
    build:
      context: ./db
    image: sigma-unb/postgres-pgvector:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOME_DO_BANCO:-sigma}
      POSTGRES_USER: ${USUARIO_DO_BANCO:-sigma}
      POSTGRES_PASSWORD: ${SENHA_DO_BANCO:-sigma}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # Porta do host configurável: útil se já houver um Postgres local na 5432.
      - "${PORTA_DO_BANCO:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://db:5432/${NOME_DO_BANCO:-sigma}
      - -user=${USUARIO_DO_BANCO:-sigma}
      - -password=${SENHA_DO_BANCO:-sigma}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=10
      - migrate

  # Ingestão de estoque e CATMAT na camada raw.
  ingest:
    build:
      context: ./codigos
    depends_on:
      migrate:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      <<: *conexao-banco
      PYTHONUNBUFFERED: "1"
      # vazio = catálogo inteiro; um número limita as páginas, para testes rápidos
      CATMAT_MAX_PAGINAS: ${CATMAT_MAX_PAGINAS:-}
    volumes:
      - ./dados:/app/dados
      # inicializar_esquema lê db/migrations/ddl.sql
      - ./db/migrations:/app/db/migrations:ro
    command:
      - sh
      - -c
      - >-
        python codigos/inserir/buscar-dados-de-almoxarifado.py
        && python codigos/inserir/baixar_catalogo_catmat.py $${CATMAT_MAX_PAGINAS:+--max-paginas $$CATMAT_MAX_PAGINAS}
        && python -m codigos.banco_de_dados.inicializar_esquema
        && python -m codigos.banco_de_dados.inserir_dados_na_camada_raw

  # Bronze e Prata (dbt). Monta o repositório porque o projeto dbt fica na raiz;
  # target/, logs/ e dbt_packages/ são criados no host (ignorados pelo git).
  transformar:
    build:
      context: ./codigos
    depends_on:
      ingest:
        condition: service_completed_successfully
    working_dir: /projeto
    environment: *conexao-banco
    volumes:
      - .:/projeto
    command: ["sh", "-c", "dbt deps && dbt build --profiles-dir . --project-dir . --exclude path:snapshots path:models/ouro"]

  # Busca semântica: embeddings (pgvector) e candidatos CATMAT para revisão.
  semantica:
    build:
      context: ./codigos
      dockerfile: semantica/Dockerfile
    depends_on:
      transformar:
        condition: service_completed_successfully
    environment:
      <<: *conexao-banco
      SEMANTICA_MODELO: ${SEMANTICA_MODELO:-intfloat/multilingual-e5-small}
      SEMANTICA_REVISAO: ${SEMANTICA_REVISAO:-}
      SEMANTICA_TOP_K: ${SEMANTICA_TOP_K:-10}
      SEMANTICA_LIMIAR: ${SEMANTICA_LIMIAR:-}
      SEMANTICA_BUSCA_EXATA: ${SEMANTICA_BUSCA_EXATA:-}
      SEMANTICA_METODO: ${SEMANTICA_METODO:-hibrido}
      SEMANTICA_K_VETOR: ${SEMANTICA_K_VETOR:-50}
      SEMANTICA_K_TRIGRAMA: ${SEMANTICA_K_TRIGRAMA:-20}
    volumes:
      - modelos:/modelos
      # a etapa `fila` grava o CSV de revisão em dados/semantica
      - ./dados:/app/codigos/dados
    # Depois da busca, carrega as decisões sugeridas por agentes de IA
    # (tipo_revisor = agente). Decisões de pessoas registradas antes não são
    # sobrescritas; ver codigos/semantica/decisoes.py.
    command:
      - sh
      - -c
      - >-
        python -m semantica tudo
        && python -m semantica importar --arquivo semantica/decisoes/decisoes_agentes.csv
        --revisor agente --tipo-revisor agente

  # Compras públicas dos itens CATMAT aprovados (semantica.v_item_aprovado).
  # As páginas da API ficam em dados/compras_cache: outra execução só baixa o que falta.
  # A janela (COMPRAS_INICIO/COMPRAS_FIM) também é lida pelo dbt (dbt_project.yml).
  compras:
    build:
      context: ./codigos
    depends_on:
      semantica:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      <<: *conexao-banco
      PYTHONUNBUFFERED: "1"
      COMPRAS_INICIO: ${COMPRAS_INICIO:-2025-07-01}
      COMPRAS_FIM: ${COMPRAS_FIM:-2025-12-31}
    volumes:
      - ./dados:/app/dados
    command:
      - sh
      - -c
      - >-
        python codigos/inserir/baixar_compras.py --inicio "$$COMPRAS_INICIO" --fim "$$COMPRAS_FIM"
        && python -m codigos.banco_de_dados.inserir_dados_na_camada_raw compras

  # Compras (bronze, prata), snapshot da correspondência (SCD tipo 2) e camada
  # ouro. Roda depois de semantica e compras porque depende das decisões e dos preços.
  transformar_ouro:
    build:
      context: ./codigos
    depends_on:
      compras:
        condition: service_completed_successfully
    working_dir: /projeto
    environment:
      <<: *conexao-banco
      COMPRAS_INICIO: ${COMPRAS_INICIO:-2025-07-01}
      COMPRAS_FIM: ${COMPRAS_FIM:-2025-12-31}
    volumes:
      - .:/projeto
    command: ["sh", "-c", "dbt deps && dbt build --profiles-dir . --project-dir . --select compras_bronze+ path:snapshots+ path:models/ouro+"]

  # Painel analítico (Streamlit) sobre a camada ouro: http://localhost:8501
  # Fica no ar, como o db; lê o que o último transformar_ouro gravou.
  painel:
    build:
      context: ./painel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *conexao-banco
    ports:
      - "${PORTA_DO_PAINEL:-8501}:8501"

volumes:
  pgdata:
  # cache do Hugging Face (modelo de embeddings)
  modelos:
